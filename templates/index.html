<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Приватное обучение от @refiralov</title>
    <style>
        :root {
            --primary: #00ffcc;
            --bg: #0a0b10;
            --card-bg: #161b22;
            --text: #e6edf3;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-image: radial-gradient(circle at 50% 50%, #1a1f35 0%, #0a0b10 100%);
        }

        .main-card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            border: 1px solid #30363d;
            max-width: 500px;
            width: 90%;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .main-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #fff, var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
            line-height: 1.2;
        }

        .author {
            color: var(--primary);
            font-weight: bold;
            font-size: 1.2rem;
            display: block;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        p {
            color: #8b949e;
            line-height: 1.6;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }

        .price-tag {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 30px;
            color: #fff;
        }

        .buy-btn {
            background: var(--primary);
            color: #000;
            border: none;
            padding: 18px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
            text-transform: uppercase;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.3);
        }

        .buy-btn:hover {
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.6);
            transform: scale(1.02);
        }

        .features {
            text-align: left;
            margin: 25px 0;
            padding-left: 20px;
            list-style: none;
        }

        .features li {
            margin-bottom: 10px;
            color: #c9d1d9;
            position: relative;
        }

        .features li::before {
            content: "▹";
            position: absolute;
            left: -20px;
            color: var(--primary);
        }
    </style>
</head>
<body>

<div class="main-card">
    <h1>Приватное обучение OSINT</h1>
    <span class="author">от @refiralov</span>
    
    <p>Стань профессионалом в поиске информации. Эксклюзивные методы, софт и личное сопровождение до результата.</p>
    
    <ul class="features">
        <li>Поиск по базам данных</li>
        <li>Деанонимизация и пробив</li>
        <li>Софт для автоматизации</li>
        <li>Закрытое комьюнити</li>
    </ul>

    <div class="price-tag">5 000 ₽</div>

    <form action="/buy/Приватное обучение" method="POST">
        <button type="submit" class="buy-btn">Получить доступ</button>
    </form>
</div>

</body>
</html>
