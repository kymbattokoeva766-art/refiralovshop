<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Приватный канал (TG BETA)</title>
    <style>
        :root { --primary: #f0f; --accent: #00f0ff; --bg: #050505; --card-bg: #111; }
        body { background-color: var(--bg); color: #fff; font-family: 'Courier New', monospace; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
        .main-card { background: var(--card-bg); padding: 50px 30px; border-radius: 20px; border: 2px solid #222; max-width: 500px; width: 90%; text-align: center; box-shadow: 0 0 40px #000; }
        h1 { font-size: 3rem; margin: 0; text-transform: uppercase; color: #fff; text-shadow: 2px 2px 0 var(--primary); }
        .sub-header { display: block; margin-top: 10px; font-size: 1.4rem; color: var(--accent); font-weight: bold; }
        .price-container { margin: 40px 0; padding: 20px; border: 1px dashed #444; border-radius: 12px; }
        .price-value { font-size: 2.2rem; font-weight: bold; }
        .buy-btn { background: #fff; color: #000; border: none; padding: 20px; font-size: 1.3rem; font-weight: 900; border-radius: 10px; cursor: pointer; width: 100%; text-transform: uppercase; transition: 0.3s; }
        .buy-btn:hover { background: var(--accent); transform: scale(1.02); }
    </style>
</head>
<body>

<div class="main-card">
    <h1>Приватный канал</h1>
    <span class="sub-header">(TG BETA)</span>
    <p style="color: #aaa; margin: 20px 0;">Обучение осинт/докс/ддос от @refiralov</p>

    <div class="price-container">
        <div class="price-value">5 NFT Тортов</div>
    </div>

    <form action="/captcha/Приватный канал" method="GET">
        <button type="submit" class="buy-btn">Вступить в канал</button>
    </form>
</div>

</body>
</html>
