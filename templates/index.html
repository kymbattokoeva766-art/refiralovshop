<!DOCTYPE html>
<html lang="ru">
<head>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Приватный канал (TG BETA)</title>
    <style>
        :root {
            --primary: #f0f; /* Неоновый розовый */
            --accent: #00f0ff; /* Кибер-голубой */
            --bg: #050505;
            --card-bg: #111;
        }

        body {
            background-color: var(--bg);
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Эффект свечения на фоне */
        body::before {
            content: "";
            position: absolute;
            width: 300px;
            height: 300px;
            background: var(--primary);
            filter: blur(150px);
            opacity: 0.15;
            z-index: -1;
        }

        .main-card {
            background: var(--card-bg);
            padding: 50px 30px;
            border-radius: 20px;
            border: 2px solid #222;
            max-width: 500px;
            width: 90%;
            text-align: center;
            position: relative;
            box-shadow: 0 0 40px rgba(0,0,0,1);
        }

        .main-card:hover {
            border-color: var(--accent);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
        }

        h1 {
            font-size: 3rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: -2px;
            line-height: 1;
            color: #fff;
            text-shadow: 2px 2px 0 var(--primary);
        }

        .sub-header {
            display: block;
            margin-top: 10px;
            font-size: 1.4rem;
            color: var(--accent);
            font-weight: bold;
        }

        .author-tag {
            background: #222;
            padding: 5px 15px;
            border-radius: 50px;
            font-size: 0.9rem;
            color: #888;
            display: inline-block;
            margin-top: 15px;
        }

        .description {
            margin: 40px 0;
            color: #aaa;
            font-size: 1.1rem;
            line-height: 1.5;
        }

        .price-container {
            margin-bottom: 40px;
            padding: 20px;
            border: 1px dashed #444;
            border-radius: 12px;
        }

        .price-label {
            display: block;
            font-size: 0.8rem;
            color: #666;
            margin-bottom: 5px;
        }

        .price-value {
            font-size: 2.2rem;
            font-weight: bold;
            color: #fff;
        }
