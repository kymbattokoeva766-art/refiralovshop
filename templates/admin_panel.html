<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель управления</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0d1117; color: #c9d1d9; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        h2 { color: #58a6ff; border-bottom: 1px solid #30363d; padding-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #161b22; border-radius: 8px; overflow: hidden; }
        th, td { border: 1px solid #30363d; padding: 12px; text-align: left; font-size: 14px; }
        th { background-color: #21262d; color: #8b949e; }
        .btn { padding: 5px 10px; border-radius: 4px; text-decoration: none; color: white; font-size: 12px; margin-right: 5px; display: inline-block; }
        .btn-ok { background: #238636; }
        .btn-cancel { background: #8b949e; }
        .btn-del { background: #da3633; }
        .status-badge { padding: 2px 6px; border-radius: 10px; font-size: 11px; font-weight: bold; }
        .status-paid { background: #238636; color: white; }
        .status-wait { background: #d29922; color: black; }
        .logout { display: inline-block; margin-top: 20px; color: #f85149; text-decoration: none; }
        input { background: #0d1117; border: 1px solid #30363d; color: white; padding: 10px; width: 100%; box-sizing: border-box; margin-bottom: 10px; border-radius: 6px; }
        .login-box { max-width: 300px; margin: 100px auto; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        {% if logged_in %}
            <h2>🛒 Управление заказами</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Товар</th>
                        <th>Код</th>
                        <th>Контакт</th>
                        <th>Статус</th>
                        <th>Действие</th>
                    </tr>
                </thead>
                <tbody>
                    {% for order in orders %}
                    <tr>
                        <td>{{ order.id }}</td>
                        <td>{{ order.item }}</td>
                        <td style="color: #58a6ff;">{{ order.unique_code }}</td>
                        <td>{{ order.contact }}</td>
                        <td>
                            <span class="status-badge {% if order.status == 'Оплачено' %}status-paid{% elif order.status == 'Проверка оплаты' %}status-wait{% endif %}">
                                {{ order.status }}
                            </span>
                        </td>
                        <td>
                            <a href="/admin/update_status/{{ order.id }}/Оплачено" class="btn btn-ok">✅</a>
                            <a href="/admin/update_status/{{ order.id }}/Отменен" class="btn btn-cancel">❌</a>
                            <a href="/admin/delete/{{ order.id }}" class="btn btn-del" onclick="return confirm('Удалить заказ?')">🗑</a>
                        </td>
                    </tr>
                    {% else %}
                    <tr><td colspan="6" style="text-align:center; color: gray; padding: 40px;">Заказов пока нет</td></tr>
                    {% endfor %}
                </tbody>
            </table>
            <a href="/admin/logout" class="logout">Выход из системы</a>
        {% else %}
            <div class="login-box">
                <h2>🔐 Вход</h2>
                <form method="POST">
                    <input type="password" name="password" placeholder="Пароль" required>
                    <button type="submit" style="background: #238636; color: white; border: none; padding: 10px; width: 100%; border-radius: 6px; cursor: pointer;">Войти</button>
                </form>
            </div>
        {% endif %}
    </div>
</body>
</html>
