<!DOCTYPE html>
<html>
<head>
    <title>OSINT ADMIN PANEL</title>
    <style>
        body { background: #0a0a0a; color: #0f0; font-family: 'Courier New'; padding: 20px; }
        .stat-card { background: #111; border: 1px solid #0f0; display: inline-block; padding: 20px; margin-right: 20px; box-shadow: 0 0 15px #0f03; }
        table { width: 100%; border-collapse: collapse; margin-top: 30px; }
        th, td { border: 1px solid #333; padding: 15px; text-align: left; }
        th { background: #0f0; color: #000; }
        .btn { padding: 5px 10px; cursor: pointer; border: none; font-weight: bold; }
        .btn-check { background: #00f0ff; }
        .btn-del { background: #f0f; color: #fff; }
        tr:hover { background: #151515; }
        .glitch { animation: glitch 1s linear infinite; }
        @keyframes glitch { 0% { opacity: 1; } 50% { opacity: 0.8; } 100% { opacity: 1; } }
    </style>
</head>
<body>
    <h1 class="glitch">SYSTEM ADMINISTRATION v2.0</h1>
    <div class="stat-card">ЗАКАЗОВ: {{ stats.total }}</div>
    <div class="stat-card">НА ПРОВЕРКЕ: {{ stats.pending }}</div>

    <table>
        <tr>
            <th>ID</th>
            <th>ТОВАР</th>
            <th>КОНТАКТ</th>
            <th>СТАТУС</th>
            <th>ДЕЙСТВИЯ</th>
        </tr>
        {% for o in orders %}
        <tr>
            <td>{{ o.unique_code }}</td>
            <td>{{ o.item }}</td>
            <td>{{ o.contact or '---' }}</td>
            <td style="color: {% if o.status == 'Проверка' %}#00f0ff{% else %}#0f0{% endif %}">{{ o.status }}</td>
            <td>
                <a href="/admin/status/{{o.id}}/Принят"><button class="btn btn-check">V</button></a>
                <a href="/admin/delete/{{o.id}}"><button class="btn btn-del">X</button></a>
            </td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
