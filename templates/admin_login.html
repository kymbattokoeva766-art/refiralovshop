<!DOCTYPE html>
<html>
<head>
    <title>LOGIN | OSINT SYSTEM</title>
    <style>
        body { background: #050505; color: #0f0; font-family: 'Courier New'; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .login-box { border: 2px solid #0f0; padding: 30px; background: #111; box-shadow: 0 0 20px #0f03; text-align: center; }
        input { background: #000; border: 1px solid #0f0; color: #0f0; padding: 10px; margin: 10px 0; width: 200px; text-align: center; }
        button { background: #0f0; color: #000; border: none; padding: 10px 20px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>ACCESS REQUIRED</h2>
        <form method="POST">
            <input type="password" name="pass" placeholder="ENTER PASSWORD" required>
            <br>
            <button type="submit">LOGIN</button>
        </form>
    </div>
</body>
</html>
