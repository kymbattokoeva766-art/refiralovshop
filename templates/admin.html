<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель</title>
    <style>
        body { font-family: monospace; background-color: #0d1117; color: #c9d1d9; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        h2 { color: #58a6ff; border-bottom: 1px solid #30363d; padding-bottom: 10px; }
        input { background: #0d1117; border: 1px solid #30363d; color: white; padding: 10px; width: 100%; box-sizing: border-box; margin-bottom: 10px; }
        button { background: #238636; color: white; border: none; padding: 10px 20px; cursor: pointer; width: 100%; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #30363d; padding: 10px; text-align: left; font-size: 14px; }
        th { color: #8b949e; }
        .logout { display: inline-block; margin-top: 20px; color: #f85149; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        {% if logged_in %}
            <h2>Панель Администратора</h2>
            
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Товар</th>
                        <th>Код (для клиента)</th>
                        <th>Контакт</th>
                        <th>Статус</th>
                    </tr>
                </thead>
                <tbody>
                    {% for order in orders %}
                    <tr>
                        <td>{{ order.id }}</td>
                        <td>{{ order.item }}</td>
                        <td>{{ order.unique_code }}</td>
                        <td>{{ order.contact }}</td>
                        <td>{{ order.status }}</td>
                    </tr>
                    {% else %}
                    <tr>
                        <td colspan="5" style="text-align:center; color: gray;">Заказов пока нет</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>

            <a href="/admin/logout" class="logout">Выйти</a>

        {% else %}
            <h2>Вход в систему</h2>
            <form method="POST">
                <input type="password" name="password" placeholder="Введите пароль" required>
                <button type="submit">Войти</button>
            </form>
        {% endif %}
    </div>
</body>
</html>
